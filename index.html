<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8f6f49">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LAVÉA POS">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
<title>LAVÉA Laundry POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: fixed dark sidebar + light work area; one screen per module; cards for data, tables for ledgers. */
:root{
  --bg:#f4f6fb; --surface:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e5e9f2; --soft:#f1f4fa;
  --accent:#4f46e5; --accent-ink:#ffffff; --accent-soft:#e8e7fd;
  --nav:#0e1a30; --nav-ink:#c3cde0; --nav-on:#4f46e5;
  --good:#15803d; --good-bg:#dcf5e5; --warn:#b45309; --warn-bg:#fdf0d2; --bad:#c42b3a; --bad-bg:#fde4e7; --info:#0369a1; --info-bg:#dbeefb;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.05);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --surface:#131c2e; --ink:#e8edf7; --muted:#8c9ab3; --line:#24304a; --soft:#18233a;
  --accent:#7c78f4; --accent-ink:#0b1220; --accent-soft:#25264f;
  --nav:#080f1d; --nav-ink:#a9b6cf; --nav-on:#5b55e6;
  --good:#5fd38d; --good-bg:#14352347; --warn:#f0b559; --warn-bg:#3d2c0f66; --bad:#ff7d8a; --bad-bg:#47151d66; --info:#6cc0f2; --info-bg:#0f304766;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1220; --surface:#131c2e; --ink:#e8edf7; --muted:#8c9ab3; --line:#24304a; --soft:#18233a;
  --accent:#7c78f4; --accent-ink:#0b1220; --accent-soft:#25264f;
  --nav:#080f1d; --nav-ink:#a9b6cf; --nav-on:#5b55e6;
  --good:#5fd38d; --good-bg:#14352347; --warn:#f0b559; --warn-bg:#3d2c0f66; --bad:#ff7d8a; --bad-bg:#47151d66; --info:#6cc0f2; --info-bg:#0f304766;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

#app{display:flex;height:100%;min-height:0}
.side{width:248px;flex:none;background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;height:100%;overflow:auto;transition:transform .2s}
.brand{display:flex;align-items:center;gap:12px;padding:20px 18px;border-bottom:1px solid #ffffff14}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#38bdf8,#4f46e5);display:grid;place-items:center;color:#fff;flex:none}
.brand b{display:block;color:#fff;font-size:17px;letter-spacing:-.01em}
.brand .pos{font-size:10px;background:#22d3ee;color:#04283a;border-radius:6px;padding:1px 5px;margin-left:4px;vertical-align:2px;font-weight:800}
.brand small{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;opacity:.75;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:4px;padding:14px 12px;flex:1}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:inherit;padding:11px 14px;border-radius:10px;text-align:left;cursor:pointer;font-weight:500;font-size:14.5px}
.nav button:hover{background:#ffffff0f}
.nav button.on{background:var(--nav-on);color:#fff;font-weight:600}
.me{margin:12px;padding:12px;border-radius:12px;background:#ffffff12;display:flex;gap:10px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.me div{min-width:0;flex:1}
.me b{display:block;color:#fff;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me small{opacity:.7;font-size:11px}
.me button{background:none;border:0;color:inherit;cursor:pointer;padding:6px;border-radius:8px}
.me button:hover{background:#ffffff1f}

.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:14px;padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-size:21px;font-weight:700;color:var(--muted);letter-spacing:-.01em;margin-right:auto}
.burger{display:none;background:none;border:0;cursor:pointer;padding:6px;border-radius:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.info{background:var(--info-bg);color:var(--info)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.mute{background:var(--soft);color:var(--muted)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.who{display:flex;gap:10px;align-items:center;padding-left:14px;border-left:1px solid var(--line)}
.who b{display:block;font-size:13px;line-height:1.2}.who small{font-size:10.5px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.datebox{color:var(--muted);font-size:13.5px}
.content{flex:1;overflow:auto;padding:24px 28px 40px}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:18px 20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:12px}.bold{font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.pri:hover{filter:brightness(1.08)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.dng{color:var(--bad);border-color:var(--bad)}.btn.dng.solid{background:var(--bad);color:#fff}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn.lg{padding:13px 18px;font-size:15px;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px;cursor:pointer;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--soft)}.icon-btn.dng{color:var(--bad)}.icon-btn.acc{color:var(--accent)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 12px;min-width:220px;flex:1;max-width:560px}
.search input{border:0;background:none;outline:0;padding:10px 0;width:100%}
.search:focus-within{border-color:var(--accent)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field{display:flex;flex-direction:column;min-width:0}
.field label span{text-transform:none;letter-spacing:0;font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.chip{display:inline-block;padding:3px 10px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;font-weight:500;background:var(--surface)}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 16px;cursor:pointer;font-weight:500;font-size:13.5px}
.chipbtn:hover{background:var(--soft)}
.chipbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.chipbtn b{background:var(--soft);color:var(--muted);border-radius:99px;padding:1px 8px;margin-left:6px;font-size:12px}
.chipbtn.on b{background:#ffffff33;color:inherit}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.stat{padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.stat .si{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}
.stat small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat b{display:block;font-size:26px;letter-spacing:-.02em;line-height:1.2}
.stat .sub{font-size:12px;color:var(--muted)}
.tone-acc{background:var(--accent-soft);color:var(--accent)}.tone-good{background:var(--good-bg);color:var(--good)}.tone-warn{background:var(--warn-bg);color:var(--warn)}.tone-bad{background:var(--bad-bg);color:var(--bad)}.tone-info{background:var(--info-bg);color:var(--info)}
.t-good{color:var(--good)}.t-bad{color:var(--bad)}.t-warn{color:var(--warn)}.t-acc{color:var(--accent)}

.banner{background:linear-gradient(120deg,#3b34c9,#5a52f0);color:#fff;border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.banner .top2{display:flex;gap:28px;flex-wrap:wrap;justify-content:space-between;align-items:flex-end}
.banner small{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;opacity:.8;font-weight:700}
.banner .big{font-size:36px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.banner .kpis{display:flex;gap:34px;flex-wrap:wrap}
.banner .kpis b{font-size:22px;display:block}
.bar{height:5px;border-radius:9px;background:#ffffff40;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:9px}
.methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.methods div{background:#ffffff26;border-radius:10px;padding:9px 12px}
.methods div.has{background:#fff;color:#1e1b4b}
.methods b{display:block;font-size:17px}
.methods small{font-size:10px;opacity:.85}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tile{padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600;display:flex;gap:10px;align-items:center}
.tile b{font-size:20px}
.tile.on{outline:2px solid var(--accent);background:var(--accent-soft)}
.tile.b-in b{color:var(--info)}.tile.b-wa b{color:var(--warn)}.tile.b-go b{color:var(--good)}.tile.b-ba b{color:var(--bad)}

/* POS */
.posgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.svc{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:7px;overflow:hidden;position:relative}
.svc::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.svc .sw{height:74px;border-radius:9px;background:var(--c);display:grid;place-items:center;color:#fff;margin-top:4px}
.svc .sw .ic{width:30px;height:30px}
.svc h3{font-size:14px}
.svc .av{font-size:11.5px;color:var(--good);display:flex;align-items:center;gap:6px}
.svc .av::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.svc .av.no{color:var(--muted)}.svc .av.low{color:var(--warn)}.svc .av.out{color:var(--bad)}
.svc .pr{display:flex;align-items:center;justify-content:space-between;border-top:1px dashed var(--line);padding-top:8px;color:var(--accent);font-weight:800}
.svc .pr small{color:var(--muted);font-weight:500;font-size:11px}
.addbtn{width:30px;height:30px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center}
.addbtn:disabled{opacity:.4;cursor:not-allowed}
.cart{padding:18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0}
.cartlist{display:flex;flex-direction:column;gap:10px;min-height:90px;max-height:290px;overflow:auto}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px;border:1px solid var(--line);border-radius:12px}
.line .qty{display:flex;align-items:center;gap:4px}
.line .qty button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.line .qty input{width:58px;padding:4px 6px;text-align:center}
.cartempty{text-align:center;color:var(--muted);padding:28px 8px}
.cartempty .ic{width:44px;height:44px;opacity:.4}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.totals div{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted)}
.totals .tt{color:var(--ink);font-weight:800;font-size:18px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.totals .tt span:last-child{color:var(--accent);font-size:24px}

/* dashboard */
.dgrid{display:grid;gap:18px}
.d3{grid-template-columns:1.5fr 1fr 1fr}
.d3b{grid-template-columns:1.3fr 1.1fr 1.3fr}
.chartbox{width:100%;overflow:hidden}
.chartbox svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:130px 1fr 30px;gap:10px;align-items:center;font-size:12.5px;margin:9px 0}
.hbar .t{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}.hbar .t i{display:block;height:100%;border-radius:6px}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;align-items:center}
.flow .st b{display:block;font-size:26px}
.flow .ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin:0 auto 6px}
.list > div{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list > div:last-child{border:0}
.list .ic{flex:none}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini div{border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.mini small{font-size:10.5px;letter-spacing:.07em;font-weight:700;color:var(--muted);display:block}
.mini b{font-size:18px}
.qa{display:flex;flex-wrap:wrap;gap:8px}

/* modal / toast / popover */
.ovl{position:fixed;inset:0;background:rgba(7,12,24,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto;z-index:50}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:540px;box-shadow:0 24px 70px rgba(0,0,0,.35);border:1px solid var(--line)}
.modal.wide{max-width:720px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.mh h2{font-size:18px}
.mb{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.mf{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:12px;font-weight:600;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw}
.toast.err{background:var(--bad);color:#fff}
.pop{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.25);min-width:190px;padding:5px}
.pop button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:500;text-align:left}
.pop button:hover{background:var(--soft)}.pop button.dng{color:var(--bad)}
.opr{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.opr:last-child{border:0}
.opr .avatar{background:var(--accent-soft);color:var(--accent)}
.sect{display:flex;gap:14px;align-items:center}
.sect .si{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.sect h2{font-size:18px}
.dz{border:1px solid var(--bad);background:var(--bad-bg);border-radius:12px;padding:14px 16px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(1200px 600px at 20% -10%,#4f46e533,transparent),var(--bg)}
.login .box{width:100%;max-width:400px;padding:30px;display:flex;flex-direction:column;gap:16px}
.login .logo{width:54px;height:54px}

.rt{min-width:480px}.r-h td{background:var(--soft);font-weight:700;text-transform:uppercase;font-size:11.5px;letter-spacing:.06em;color:var(--muted)}.r-sub td{font-weight:700;border-top:1.5px solid var(--ink)}.r-tot td{font-weight:800;background:var(--accent-soft);color:var(--accent)}
.modal.co{max-height:92vh;overflow:auto}
.co-h{gap:12px;flex-wrap:wrap}.co-ic{width:46px;height:46px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.cobox{border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.cosec{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--soft);cursor:pointer;text-align:left}
.cosec.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}.cosec .chev{display:grid;transition:transform .15s}.cosec.on .chev{transform:rotate(180deg)}
.copanel{padding:6px 4px 10px;align-items:start}
.ig{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.ig>span,.ig>button{padding:0 14px;background:var(--soft);border:0;border-right:1px solid var(--line);display:grid;place-items:center;font-weight:700;cursor:pointer}
.ig>button.on{background:var(--accent);color:var(--accent-ink)}
.ig input{border:0;border-radius:0;outline-offset:-2px}

async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('lpos:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of 'lpos:'+s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'x'+h}}

const prod=id=>S.products.find(p=>p.id===id);

function loadsOf(s,qty){return s.type==='Per Kg'?Math.max(1,Math.ceil(qty/7)):qty}
function availability(s){
  if(!s.materials||!s.materials.length)return null;
  let m=Infinity;for(const x of s.materials){const p=prod(x.pid);m=Math.min(m,p?Math.floor(p.stock/(x.qty||1)):0)}
  return m===Infinity?null:m}
function calcTotals(cart,discount,delivery){
  const sub=r2(cart.reduce((a,l)=>a+lineAmount(l),0));
  const disc=Math.min(r2(discount||0),sub);
  const rate=S.business.taxEnabled?Number(S.business.taxRate)||0:0;
  const tax=r2((sub-disc)*rate/100);
  const del=Math.max(0,r2(delivery||0));
  return {subtotal:sub,discount:disc,tax,delivery:del,total:r2(sub-disc+tax+del),rate}}
function lineAmount(l){
  if(l.kind==='service'){const s=svc(l.refId);return s?r2(s.price*l.qty):0}
  const p=prod(l.refId);return p?r2(p.price*l.qty):0}
function paidOf(o){return r2(o.payments.reduce((a,p)=>a+p.amount,0))}
function balanceOf(o){return o.status==='Cancelled'?0:Math.max(0,r2(o.total-paidOf(o)))}
function payState(o){const p=paidOf(o);return p>=o.total-0.005?'Paid':p>0?'Partial':'Unpaid'}
function isOverdue(o){return !!o.expected&&!['Completed','Cancelled'].includes(o.status)&&new Date(o.expected)<new Date()}
function makeOrder(cart,o){
  const items=cart.map(l=>{
    if(l.kind==='service'){const s=svc(l.refId);return {kind:'service',refId:s.id,name:s.name,qty:l.qty,price:s.price,type:s.type,amount:r2(s.price*l.qty)}}
    const p=prod(l.refId);return {kind:'addon',refId:p.id,name:p.name,qty:l.qty,price:p.price,type:'Add-on',amount:r2(p.price*l.qty)}});
  const t=calcTotals(cart,o.discount,o.delivery);
  const created=o.date||new Date();
  const ord={id:uid('ord'),no:'ORD-'+dkey(created).replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,10).toUpperCase(),
    customerId:o.cust||'walkin',items,subtotal:t.subtotal,discount:t.discount,tax:t.tax,taxRate:t.rate,delivery:t.delivery,address:o.address||'',discountType:o.discountType||'',discountReason:o.discountReason||'',total:t.total,
    status:o.status||'Received',created:created.toISOString(),expected:o.expected?new Date(o.expected).toISOString():'',
    completedAt:o.status==='Completed'?(o.completedAt||created.toISOString()):'',cashierId:o.by,payments:[]};
  const pay=o.pay===true?t.total:Number(o.pay)||0;
  if(pay>0)ord.payments.push({id:uid('pay'),amount:r2(Math.min(pay,t.total)),method:o.method||'Cash',date:created.toISOString(),operatorId:o.by,tendered:o.tendered||0,change:o.change||0});
  return ord}
function consume(cart){
  for(const l of cart){
    if(l.kind==='service'){const s=svc(l.refId);const n=loadsOf(s,l.qty);for(const m of s.materials||[]){const p=prod(m.pid);if(p)p.stock=Math.max(0,r2(p.stock-m.qty*n))}}
    else{const p=prod(l.refId);if(p)p.stock=Math.max(0,r2(p.stock-l.qty))}}}
function checkStock(cart){
  const need={};
  for(const l of cart){
    if(l.kind==='service'){const s=svc(l.refId);const n=loadsOf(s,l.qty);for(const m of s.materials||[])need[m.pid]=(need[m.pid]||0)+m.qty*n}
    else need[l.refId]=(need[l.refId]||0)+l.qty}
  for(const id in need){const p=prod(id);if(!p||p.stock<need[id])return 'Not enough stock of '+(p?p.name:'a product')+' ('+(p?p.stock:0)+' left, '+need[id]+' needed).'}
  return ''}
function inPeriod(P,s){
  if(!s)return false;const d=parseD(s),n=new Date(),t=dkey(n),k=dkey(d);

    case 'all':return true;
    case 'today':return k===t;
    case 'yesterday':{const y=new Date(n);y.setDate(y.getDate()-1);return k===dkey(y)}
    case 'week':{const a=new Date(n);a.setDate(a.getDate()-6);return k>=dkey(a)&&k<=t}
    case 'month':return k.slice(0,7)===t.slice(0,7);
    case 'range':return (!P.from||k>=P.from)&&(!P.to||k<=P.to);
    case 'year':return d.getFullYear()==P.year;
    default:{const q=parseInt(P.p.slice(1));return d.getFullYear()==P.year&&Math.floor(d.getMonth()/3)+1===q}}}

function last7(){const a=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push(d)}return a}
function perfChart(){
  const days=last7();
  const sales=days.map(d=>S.orders.filter(o=>o.status!=='Cancelled'&&dkey(new Date(o.created))===dkey(d)).reduce((a,o)=>a+o.total,0));
  const done=days.map(d=>S.orders.filter(o=>o.status==='Completed'&&o.completedAt&&dkey(new Date(o.completedAt))===dkey(d)).length);
  const W=640,H=250,L=52,R=34,T=14,B=30,iw=W-L-R,ih=H-T-B;
  const nice=v=>{if(v<=0)return 100;const m=Math.pow(10,Math.floor(Math.log10(v)));const f=v/m;return (f<=1?1:f<=2?2:f<=5?5:10)*m};
  const ym=nice(Math.max(...sales)),cm=Math.max(4,Math.max(...done));
  const x=i=>L+iw*(i+.5)/7,ys=v=>T+ih-ih*v/ym,yc=v=>T+ih-ih*v/cm;
  let g='';
  for(let i=0;i<=4;i++){const v=ym*i/4,y=ys(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${sym()}${v>=1000?(v/1000)+'K':v}</text>`}
  for(let i=0;i<=cm&&cm<=10;i+=Math.ceil(cm/4)){g+=`<text x="${W-R+8}" y="${yc(i)+4}" font-size="11" fill="var(--muted)">${i}</text>`}
  const bars=done.map((v,i)=>v?`<rect x="${x(i)-13}" y="${yc(v)}" width="26" height="${T+ih-yc(v)}" rx="4" fill="var(--good)" opacity=".75"><title>${v} completed</title></rect>`:'').join('');
  const pts=sales.map((v,i)=>[x(i),ys(v)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${pts[6][0]} ${T+ih} L${pts[0][0]} ${T+ih} Z`;
  const lab=days.map((d,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</text>`).join('');
  const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===6?5:3.5}" fill="${i===6?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2"><title>${peso(sales[i])}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sales and completed orders over the last 7 days">${g}${bars}<path d="${area}" fill="var(--accent)" opacity=".1"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${dots}${lab}</svg>`}
function cashChart(){
  const days=last7();
  const col=days.map(d=>S.orders.reduce((a,o)=>a+o.payments.filter(p=>dkey(new Date(p.date))===dkey(d)).reduce((x,p)=>x+p.amount,0),0));
  const exp=days.map(d=>S.expenses.filter(e=>e.date===dkey(d)).reduce((a,e)=>a+e.amount,0));
  const W=520,H=240,L=52,R=8,T=12,B=28,iw=W-L-R,ih=H-T-B;
  const nice=v=>{if(v<=0)return 100;const m=Math.pow(10,Math.floor(Math.log10(v)));const f=v/m;return (f<=1?1:f<=2?2:f<=5?5:10)*m};
  const ym=nice(Math.max(...col,...exp));const y=v=>T+ih-ih*v/ym;
  let g='';for(let i=0;i<=4;i++){const v=ym*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${sym()}${v>=1000?(v/1000)+'K':v}</text>`}
  const bw=16;const bars=days.map((d,i)=>{const cx=L+iw*(i+.5)/7;return `<rect x="${cx-bw-1}" y="${y(col[i])}" width="${bw}" height="${T+ih-y(col[i])}" rx="3" fill="var(--accent)"><title>Collected ${peso(col[i])}</title></rect><rect x="${cx+1}" y="${y(exp[i])}" width="${bw}" height="${T+ih-y(exp[i])}" rx="3" fill="var(--bad)"><title>Expenses ${peso(exp[i])}</title></rect><text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily collections versus expenses">${g}${bars}</svg>`}

/* ============ Reports (admin only) ============ */
const dOf=s=>dkey(new Date(s));
const todayKey=()=>dkey(new Date());
const STITLE={is:'Income Statement',bs:'Balance Sheet (Statement of Financial Position)',cf:'Statement of Cash Flows',sce:'Statement of Changes in Equity',ar:'Receivables Aging Schedule',days:'Daily Summary Schedule',notes:'Notes to the Statements'};
const pdfSafe=s=>String(s).replace(/[–—]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[^\x00-\xFF]/g,'?');
function fmtCell(c,mode){
  if(typeof c==='number'){
    const s=Math.abs(c).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
    const p=mode==='pdf'?curOf()[1]+' ':sym();return c<-0.004?'('+p+s+')':p+s}
  const t=c==null?'':String(c);return mode==='pdf'?pdfSafe(t):t}
function monthInfo(ym){
  const [y,m]=ym.split('-').map(Number);const pd=new Date(y,m-2,1);
  const mk=(yy,mm)=>new Date(yy,mm-1,1);
  return {y,m,from:ym+'-01',to:dkey(new Date(y,m,0)),pend:dkey(new Date(y,m-1,0)),
    label:mk(y,m).toLocaleDateString('en-US',{month:'long',year:'numeric'}),short:mk(y,m).toLocaleDateString('en-US',{month:'short',year:'numeric'}),
    prev:pd.getFullYear()+'-'+pad2(pd.getMonth()+1)}}
function agg(from,to){
  const ords=S.orders.filter(o=>o.status!=='Cancelled'&&dOf(o.created)>=from&&dOf(o.created)<=to);
  const rev={};let gross=0,disc=0,tax=0;
  ords.forEach(o=>{o.items.forEach(i=>{const k=(i.kind==='addon'?'Add-on: ':'')+i.name;rev[k]=r2((rev[k]||0)+i.amount);gross+=i.amount});disc+=o.discount||0;tax+=o.tax||0;if(o.delivery){rev['Delivery fees']=r2((rev['Delivery fees']||0)+o.delivery);gross+=o.delivery}});
  gross=r2(gross);disc=r2(disc);tax=r2(tax);
  const exp={},byAcct={};let expAll=0,remit=0;
  S.expenses.forEach(e=>{if(e.date<from||e.date>to)return;expAll+=e.amount;byAcct[e.account]=r2((byAcct[e.account]||0)+e.amount);
    if(e.account==='Tax Remittance')remit+=e.amount;else exp[e.account]=r2((exp[e.account]||0)+e.amount)});
  expAll=r2(expAll);remit=r2(remit);
  const opex=r2(Object.values(exp).reduce((a,b)=>a+b,0));
  const col={};let colAll=0,colCancelled=0;
  S.orders.forEach(o=>o.payments.forEach(p=>{const k=dOf(p.date);if(k<from||k>to)return;col[p.method]=r2((col[p.method]||0)+p.amount);colAll+=p.amount;if(o.status==='Cancelled')colCancelled+=p.amount}));
  colAll=r2(colAll);colCancelled=r2(colCancelled);
  const net=r2(gross-disc);
  return {ords,rev,gross,disc,net,tax,exp,byAcct,opex,expAll,remit,col,colAll,colCancelled,ni:r2(net-opex)}}
function arAsOf(asof){
  let t=0;const list=[];
  S.orders.forEach(o=>{if(o.status==='Cancelled'||dOf(o.created)>asof)return;
    const paid=r2(o.payments.filter(p=>dOf(p.date)<=asof).reduce((a,p)=>a+p.amount,0));const b=r2(o.total-paid);
    if(b>0.004){t+=b;list.push({o,paid,b})}});
  return {total:r2(t),list}}
function position(asof){
  const c0=agg('0000-00-00',asof),K=carryAt(asof);
  const c={...c0,net:r2(c0.net+K.net),tax:r2(c0.tax+K.tax),colAll:r2(c0.colAll+K.colAll),colCancelled:r2(c0.colCancelled+K.colCancelled),expAll:r2(c0.expAll+K.expAll),remit:r2(c0.remit+K.remit),opex:r2(c0.opex+K.opex)};c.ni=r2(c.net-c.opex);
  const capital=r2((Number(S.business.openingCapital)||0)+fundOwner('0000-00-00',asof)+K.fundOwner);
  const cash=r2(capital+c.colAll-c.expAll);const ar=arAsOf(asof);const taxPay=r2(c.tax-c.remit);const re=r2(c.net-c.opex);
  return {c,capital,cash,ar,taxPay,canc:c.colCancelled,re,assets:r2(cash+ar.total),le:r2(taxPay+c.colCancelled+capital+re)}}
const R=(c,s,i)=>({c,s,i});
const keysOf=(x,y)=>[...new Set([...Object.keys(x),...Object.keys(y)])].sort();
const pct=(n,d)=>d?(n/d*100).toFixed(1)+'%':'-';

function modelIS(ym){
  const mi=monthInfo(ym),pi=monthInfo(mi.prev);const a=agg(mi.from,mi.to),b=agg(pi.from,pi.to);const rows=[];
  rows.push(R(['Revenue','',''],'h'));
  keysOf(a.rev,b.rev).forEach(k=>rows.push(R([k,a.rev[k]||0,b.rev[k]||0],'',1)));
  if(!Object.keys(a.rev).length&&!Object.keys(b.rev).length)rows.push(R(['No sales recorded','',''],'',1));
  rows.push(R(['Gross sales',a.gross,b.gross],'sub'));
  rows.push(R(['Less: discounts given',-a.disc,-b.disc],'',1));
  rows.push(R(['Net sales',a.net,b.net],'sub'));
  rows.push(R(['Operating expenses','',''],'h'));
  keysOf(a.exp,b.exp).forEach(k=>rows.push(R([k,a.exp[k]||0,b.exp[k]||0],'',1)));
  if(!Object.keys(a.exp).length&&!Object.keys(b.exp).length)rows.push(R(['No expenses recorded','',''],'',1));
  rows.push(R(['Total operating expenses',a.opex,b.opex],'sub'));
  rows.push(R(['NET INCOME (LOSS)',a.ni,b.ni],'tot'));
  rows.push(R(['Net margin',pct(a.ni,a.net),pct(b.ni,b.net)],'',1));
  rows.push(R(['Orders counted',String(a.ords.length),String(b.ords.length)],'',1));
  return {sub:'For the month of '+mi.label,head:['',mi.short,pi.short],align:['l','r','r'],rows,
    notes:['Sales are recognised when the order is created and exclude tax. Materials purchased (Merchandise Inventory) are expensed when bought.'].concat(archivedBefore()&&mi.from<=archivedBefore()?['The previous-month column is empty because that month was archived. See the archive file for it.']:[])}}
function modelBS(ym){
  const mi=monthInfo(ym);const p=position(mi.to);const rows=[];
  rows.push(R(['Assets',''],'h'));
  rows.push(R(['Cash and e-wallets',p.cash],'',1));
  rows.push(R(['Accounts receivable (unpaid orders)',p.ar.total],'',1));
  rows.push(R(['Total assets',p.assets],'sub'));
  rows.push(R(['Liabilities',''],'h'));
  rows.push(R(['Output tax payable',p.taxPay],'',1));
  rows.push(R(['Payments held on cancelled orders',p.canc],'',1));
  rows.push(R(['Total liabilities',r2(p.taxPay+p.canc)],'sub'));
  rows.push(R(["Owner's equity",''],'h'));
  rows.push(R(["Owner's capital (opening balance and working fund)",p.capital],'',1));
  rows.push(R(['Retained earnings (cumulative)',p.re],'',1));
  rows.push(R(["Total owner's equity",r2(p.capital+p.re)],'sub'));
  rows.push(R(["TOTAL LIABILITIES AND EQUITY",p.le],'tot'));
  const inv=r2(S.products.reduce((a,x)=>a+x.stock*x.cost,0));const notes=[];
  notes.push(Math.abs(p.assets-p.le)<0.01?'Check: assets equal liabilities plus equity.':'Check: the sheet is out of balance by '+fmtCell(r2(p.assets-p.le),'html')+'. Review recent edits or deleted records.');
  notes.push('Memo: materials and supplies on hand are valued at '+fmtCell(inv,'pdf').replace('PHP ','PHP ')+' at current cost (as of today). They are expensed when purchased, so they are not shown as an asset.');
  if(p.cash<0)notes.push('Cash is negative. Set the opening cash or owner’s capital under Settings & Profile so purchases made before the first sale are funded.');
  return {sub:'As of '+fmtD(mi.to),head:['','Amount'],align:['l','r'],rows,notes}}
function modelCF(ym){
  const mi=monthInfo(ym);const a=agg(mi.from,mi.to);const ps=position(mi.pend),pe=position(mi.to);const rows=[];
  rows.push(R(['Cash received from customers',''],'h'));
  METHODS.forEach(m=>{if(a.col[m])rows.push(R([m,a.col[m]],'',1))});
  if(!a.colAll)rows.push(R(['No collections recorded',''],'',1));
  rows.push(R(['Total cash received',a.colAll],'sub'));
  rows.push(R(['Cash paid for expenses',''],'h'));
  Object.keys(a.byAcct).sort().forEach(k=>rows.push(R([k,-a.byAcct[k]],'',1)));
  if(!a.expAll)rows.push(R(['No expenses recorded',''],'',1));
  rows.push(R(['Total cash paid',-a.expAll],'sub'));
  const net=r2(a.colAll-a.expAll);
  rows.push(R(['Net cash from operating activities',net],'sub'));
  const contrib=fundOwner(mi.from,mi.to);
  rows.push(R(['Owner’s working fund contributions',contrib],'',1));
  rows.push(R(['NET INCREASE (DECREASE) IN CASH',r2(net+contrib)],'tot'));
  rows.push(R(['Cash at beginning of month',ps.cash],'',1));
  rows.push(R(['Cash at end of month',pe.cash],'sub'));
  const dAR=r2(pe.ar.total-ps.ar.total),dTax=r2(pe.taxPay-ps.taxPay),dCanc=r2(pe.canc-ps.canc);
  const rec=[R(['Net income (loss)',a.ni]),R(['Less: increase in accounts receivable',-dAR],'',1),R(['Add: increase in output tax payable',dTax],'',1),R(['Add: payments held on cancelled orders',dCanc],'',1),R(['Net cash from operating activities',r2(a.ni-dAR+dTax+dCanc)],'tot')];
  return [{sub:'For the month of '+mi.label+' (direct method)',head:['','Amount'],align:['l','r'],rows,notes:['Cash includes the cash drawer, GCash, Maya and bank transfers. Beginning cash includes the opening balance set in Settings & Profile. Working fund cash from the owner is shown as a contribution.']},
    {h:'Reconciliation of net income to operating cash flow',head:['','Amount'],align:['l','r'],rows:rec}]}
function modelSCE(ym){
  const mi=monthInfo(ym);const a=agg(mi.from,mi.to);const ps=position(mi.pend),pe=position(mi.to);
  const contrib=fundOwner(mi.from,mi.to);const rows=[R(['Opening balance',ps.capital,ps.re,r2(ps.capital+ps.re)]),R(['Net income (loss) for the month',0,a.ni,a.ni],'',1),
    R(['Owner contributions (working fund)',contrib,0,contrib],'',1),R(['CLOSING BALANCE',pe.capital,pe.re,r2(pe.capital+pe.re)],'tot')];
  return {sub:'For the month of '+mi.label,head:['',"Owner's capital",'Retained earnings','Total equity'],align:['l','r','r','r'],rows,
    notes:['Cash the owner adds to the working fund counts as an owner contribution. Owner withdrawals are not tracked by the app; record them as an expense if you want them reflected.']}}
function modelAR(ym){
  const mi=monthInfo(ym);const asof=mi.to;const ar=arAsOf(asof);
  const days=o=>Math.max(0,Math.round((parseD(asof)-parseD(dOf(o.created)))/864e5));
  const B=[['0 to 7 days',0,7],['8 to 30 days',8,30],['31 to 60 days',31,60],['Over 60 days',61,99999]];
  const sum=B.map(([l,lo,hi])=>{const x=ar.list.filter(r=>{const d=days(r.o);return d>=lo&&d<=hi});return R([l,String(x.length),r2(x.reduce((a,r)=>a+r.b,0))])});
  sum.push(R(['Total receivables',String(ar.list.length),ar.total],'tot'));
  const det=ar.list.sort((x,y)=>days(y.o)-days(x.o)).map(r=>R([r.o.no,custName(r.o),fmtD(r.o.created),r.o.total,r.paid,r.b,String(days(r.o))]));
  if(!det.length)det.push(R(['No unpaid orders','','','','','','']));
  return [{sub:'As of '+fmtD(asof),head:['Age','Orders','Balance'],align:['l','r','r'],rows:sum},
    {h:'Unpaid orders',head:['Order #','Customer','Date','Total','Paid','Balance','Age (days)'],align:['l','l','l','r','r','r','r'],rows:det}]}
function modelDays(ym){
  const mi=monthInfo(ym);const rows=[];const T={n:0,net:0,tax:0,col:0,exp:0};
  const last=parseD(mi.to).getDate();
  for(let d=1;d<=last;d++){const k=mi.from.slice(0,8)+pad2(d);const a=agg(k,k);
    if(!a.ords.length&&!a.colAll&&!a.expAll)continue;
    rows.push(R([fmtD(k),String(a.ords.length),a.net,a.tax,a.colAll,a.expAll,r2(a.colAll-a.expAll)]));
    T.n+=a.ords.length;T.net+=a.net;T.tax+=a.tax;T.col+=a.colAll;T.exp+=a.expAll}
  if(!rows.length)rows.push(R(['No activity this month','','','','','','']));
  else rows.push(R(['TOTAL',String(T.n),r2(T.net),r2(T.tax),r2(T.col),r2(T.exp),r2(T.col-T.exp)],'tot'));
  return {sub:'For the month of '+mi.label,head:['Date','Orders','Net sales','Tax billed','Collected','Expenses','Net cash'],align:['l','r','r','r','r','r','r'],rows}}
function modelNotes(){
  const t=['Basis of preparation: these are management reports generated from the sales, payments and expenses recorded in Laundry POS.',
   'Sales are recognised when an order is created. Cash received is recorded on the date the payment is collected. Expenses are recognised on the date recorded.',
   'Net sales exclude tax and discounts. Output tax payable is the tax billed on orders less any amounts recorded under the Tax Remittance expense account.',
   'Materials and supplies purchased (Merchandise Inventory) are expensed when bought. Stock on hand is disclosed as a memo on the balance sheet, not as an asset.',
   'Cash and e-wallets equal the opening cash balance in Settings & Profile, plus all recorded payments, less all recorded expenses.',
   'Not tracked: fixed assets, depreciation, loans, supplier payables, owner withdrawals and income tax. Record these as expenses if they apply to you.',
   'These reports are for management use and are not audited. Confirm figures with your accountant before filing with the BIR.'];
  return {head:['Note'],align:['l'],rows:t.map(x=>R([x]))}}
function monthGroups(ym){return {is:[modelIS(ym)],bs:[modelBS(ym)],cf:modelCF(ym),sce:[modelSCE(ym)],ar:modelAR(ym),days:[modelDays(ym)],notes:[modelNotes()]}}

function dailyModels(date){
  const a=agg(date,date);const pos=position(date);
  const orders=S.orders.filter(o=>dOf(o.created)===date).sort((x,y)=>x.created.localeCompare(y.created));
  const live=orders.filter(o=>o.status!=='Cancelled');const canc=orders.length-live.length;
  const pays=[];S.orders.forEach(o=>o.payments.forEach(p=>{if(dOf(p.date)===date)pays.push({o,p})}));pays.sort((x,y)=>x.p.date.localeCompare(y.p.date));
  const exps=S.expenses.filter(e=>e.date===date);
  const sr=[R(['Sales',''],'h'),R(['Orders created',String(live.length)+(canc?' (+'+canc+' cancelled)':'')],'',1),R(['Gross sales',a.gross],'',1),R(['Less: discounts',-a.disc],'',1),R(['Net sales',a.net],'sub'),R(['Tax billed',a.tax],'',1),R(['Total billed',r2(a.net+a.tax)],'sub'),
    R(['Collections',''],'h')];
  METHODS.forEach(m=>{if(a.col[m])sr.push(R([m,a.col[m]],'',1))});
  if(!a.colAll)sr.push(R(['No payments collected',''],'',1));
  sr.push(R(['Total collected',a.colAll],'sub'),R(['Expenses',''],'h'));
  Object.keys(a.byAcct).sort().forEach(k=>sr.push(R([k,a.byAcct[k]],'',1)));
  if(!a.expAll)sr.push(R(['No expenses recorded',''],'',1));
  sr.push(R(['Total expenses',a.expAll],'sub'),R(['Day result',''],'h'),R(['NET CASH MOVEMENT (collected less expenses)',r2(a.colAll-a.expAll)],'tot'),
    R(['Receivables outstanding at end of day',pos.ar.total],'',1),R(['Cash balance at end of day',pos.cash],'',1));
  const tm=s=>new Date(s).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  const sale=orders.map(o=>R([o.no,tm(o.created),custName(o),o.items.map(i=>i.name+' x'+i.qty).join(', '),op(o.cashierId)?op(o.cashierId).name:'-',o.total,o.status==='Cancelled'?'Cancelled':payState(o)==='Partial'?'Partial':payState(o)]));
  if(!sale.length)sale.push(R(['No orders on this date','','','','','','']));else sale.push(R(['TOTAL (excluding cancelled)','','','','',r2(live.reduce((x,o)=>x+o.total,0)),''],'tot'));
  const col=pays.map(({o,p})=>R([tm(p.date),o.no,custName(o),p.method,op(p.operatorId)?op(p.operatorId).name:'-',p.amount]));
  if(!col.length)col.push(R(['No payments on this date','','','','','']));else col.push(R(['TOTAL COLLECTED','','','','',a.colAll],'tot'));
  const ex=exps.map(e=>R([e.ref||'-',e.desc,e.account,op(e.by)?op(e.by).name:'-',e.amount]));
  if(!ex.length)ex.push(R(['No expenses on this date','','','','']));else ex.push(R(['TOTAL EXPENSES','','','',a.expAll],'tot'));
  const xs=xferList().filter(t=>t.date===date&&xDone(t)).sort((x,y)=>x.created.localeCompare(y.created));
  const xr=xs.map(t=>R([t.no,op(t.cashierId)?op(t.cashierId).name:'-',t.accountName,t.expected,t.amount,t.kept||0,t.variance]));
  if(!xr.length)xr.push(R(['No cash transfers on this date','','','','','','']));
  else xr.push(R(['TOTAL','','',r2(xs.reduce((q,t)=>q+t.expected,0)),r2(xs.reduce((q,t)=>q+t.amount,0)),r2(xs.reduce((q,t)=>q+(t.kept||0),0)),r2(xs.reduce((q,t)=>q+t.variance,0))],'tot'));
  const wr=S.operators.map(o=>{const bal=r2(wfList().filter(e=>e.by===o.id&&e.date<=date).reduce((q,e)=>q+(e.type==='fund'?e.amount:e.type==='return'?-e.amount:0),0));return {o,bal}}).filter(x=>Math.abs(x.bal)>0.004).map(x=>R([x.o.name,x.o.role||'',x.bal]));
  if(!wr.length)wr.push(R(['No working fund held in drawers','','']));else wr.push(R(['TOTAL WORKING FUND IN DRAWERS','',r2(wr.reduce((q,r)=>q+r.c[2],0))],'tot'));
  const bd=bdepList().filter(b=>b.date===date).sort((x,y)=>x.created.localeCompare(y.created)).map(b=>R([b.no,b.fromName,b.toName,b.expected,b.amount,b.variance]));
  if(!bd.length)bd.push(R(['No bank deposits on this date','','','','','']));
  bd.push(R(['CASH ON HAND AT END OF DAY (per books)','','','','',cashOnHand(date)],'tot'));
  return [{h:'Daily summary',head:['','Amount'],align:['l','r'],rows:sr},
    {h:'Daily sales',head:['Order #','Time','Customer','Services','Cashier','Total','Payment'],align:['l','l','l','l','l','r','l'],rows:sale},
    {h:'Collections received',head:['Time','Order #','Customer','Method','Received by','Amount'],align:['l','l','l','l','l','r'],rows:col},
    {h:'Daily expenses',head:['Ref','Particulars','Account','Recorded by','Amount'],align:['l','l','l','l','r'],rows:ex},
    {h:'Cash transfers (end of business day)',head:['Transfer #','Cashier','To account','Expected','Turned over','Kept as working fund','Variance'],align:['l','l','l','r','r','r','r'],rows:xr},
    {h:'Bank deposits and admin cash on hand',head:['Deposit #','From','To bank account','Book balance','Deposited','Variance'],align:['l','l','l','r','r','r'],rows:bd},
    {h:'Working fund held in cashier drawers (end of day)',head:['Cashier','Role','Working fund'],align:['l','l','r'],rows:wr}]}

  const al=m.align||[];
  const th=m.head.map((h,j)=>`<th class="${al[j]==='r'?'r':''}">${esc(h)}</th>`).join('');
  const body=m.rows.map(r=>`<tr class="${r.s?'r-'+r.s:''}">${r.c.map((c,j)=>`<td class="${al[j]==='r'?'r num':''}"${j===0&&r.i?' style="padding-left:34px"':''}>${esc(fmtCell(c,'html'))}</td>`).join('')}</tr>`).join('');

function newDoc(){const {jsPDF}=window.jspdf;return new jsPDF({unit:'mm',format:'a4'})}

  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(100,110,130);doc.text(pdfSafe(sub||''),14,39);

function pdfTable(doc,m,y){
  if(m.h){if(y>250){doc.addPage();y=18}doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(20,24,40);doc.text(pdfSafe(m.h),14,y+4);y+=7}
  const n=m.head.length,al=m.align||[];
  const body=m.rows.map(r=>{
    const f=r.s==='h'?{fontStyle:'bold',fillColor:[236,238,250],textColor:[80,90,120],fontSize:8}:r.s==='sub'?{fontStyle:'bold',fillColor:[246,247,251]}:r.s==='tot'?{fontStyle:'bold',fillColor:[225,224,252],textColor:[55,48,170]}:{};
    if(r.s==='h')return [{content:pdfSafe(String(r.c[0]).toUpperCase()),colSpan:n,styles:f}];
    return r.c.map((c,j)=>({content:(j===0&&r.i?'    ':'')+fmtCell(c,'pdf'),styles:{...f,halign:al[j]==='r'?'right':'left'}}))});
  doc.autoTable({startY:y,head:[m.head.map((h,j)=>({content:pdfSafe(h),styles:{halign:al[j]==='r'?'right':'left'}}))],body,theme:'plain',margin:{left:14,right:14},
    styles:{font:'helvetica',fontSize:9,cellPadding:{top:2,bottom:2,left:2.5,right:2.5},textColor:[30,34,52],lineColor:[225,229,240],lineWidth:0},
    headStyles:{fillColor:[79,70,229],textColor:[255,255,255],fontStyle:'bold',fontSize:8.5},
    didDrawCell:d=>{if(d.section==='body'){doc.setDrawColor(225,229,240);doc.setLineWidth(.1);doc.line(d.cell.x,d.cell.y+d.cell.height,d.cell.x+d.cell.width,d.cell.y+d.cell.height)}}});
  let end=doc.lastAutoTable.finalY;
  (m.notes||[]).forEach(t=>{const L=doc.splitTextToSize(pdfSafe(t),182);if(end+L.length*4+4>285){doc.addPage();end=18}doc.setFont('helvetica','italic');doc.setFontSize(8);doc.setTextColor(100,110,130);doc.text(L,14,end+5);end+=L.length*4+2});
  return end}
function pageFoot(doc){

  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(130,138,155);
    doc.text(pdfSafe((S.business.name||'Laundry POS')+' | generated '+new Date().toLocaleString('en-US')+' by '+me().name),14,H-8);doc.text('Page '+i+' of '+n,W-14,H-8,{align:'right'})}}

function buildMonthPDF(ym,only){
  const doc=newDoc();const G=monthGroups(ym);const label=monthInfo(ym).label;const keys=only?[only]:['is','bs','cf','sce','ar','days','notes'];
  keys.forEach((k,i)=>{if(i>0)doc.addPage();let y=pageHead(doc,STITLE[k],k==='notes'?label:(G[k][0].sub||label));G[k].forEach(m=>{y=pdfTable(doc,m,y)+8})});

async function saveFile(name,data){
  const mime=name.endsWith('.pdf')?'application/pdf':'application/json';
  if(window.claude&&window.claude.use){
    let dl=null;try{dl=await window.claude.use('downloads')}catch(e){}
    if(!dl){toast('Downloads are not available in this view.',true);return false}
    try{await dl.save({filename:name,data});toast('Ready to save: '+name);return true}catch(e){if(e&&e.code==='declined')return false;toast('Could not save the file ('+((e&&e.code)||'error')+').',true);return false}}
  try{const u=URL.createObjectURL(new Blob([data],{type:mime}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('Saved '+name);return true}
  catch(e){toast('Download is not available here.',true);return false}}
async function savePdf(doc,name){
  if(!window.jspdf){toast('The PDF library did not load. Check your internet connection and reload.',true);return}
  await saveFile(name,doc.output('arraybuffer'))}
function restoreFile(inp){
  const f=inp.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!Array.isArray(d.operators)||!Array.isArray(d.orders)||!d.business)throw 0;
    confirmBox('Restore this backup?','This replaces all data in this browser with the backup from <b>'+esc(f.name)+'</b>.'+(cloud.cfg?' <b>This device is connected to the cloud, so the shared cloud data and every other device are replaced too.</b>':''),'Restore',()=>{S=d;S.sample=false;fixBooks();if(!op(S.session&&S.session.userId))S.session=null;save();ui.view='pos';render();toast('Backup restored')},false)}

function coCalc(){
  const p=ui.pos,c=ui.co;
  const sub=r2(p.cart.reduce((a,l)=>a+lineAmount(l),0));
  const v=Math.max(0,Number(c.discVal)||0);let disc=0;
  if(c.showDisc&&v>0)disc=c.discType==='pct'?r2(sub*Math.min(v,100)/100):Math.min(r2(v),sub);
  const rate=S.business.taxEnabled?Number(S.business.taxRate)||0:0;
  const tax=r2((sub-disc)*rate/100);
  const del=c.showDel?Math.max(0,r2(c.delivery)):0;
  const total=r2(sub-disc+tax+del);
  const tend=Math.max(0,Number(c.tendered)||0);
  const later=p.pay==='later';
  const paid=later?0:r2(Math.min(tend,total));
  const change=!later&&c.method==='Cash'?Math.max(0,r2(tend-total)):0;
  let err='',reasonErr='';
  if(c.showDisc&&c.discType==='pct'&&v>100)reasonErr='A percentage discount cannot exceed 100%.';
  else if(disc>0&&!c.reason)reasonErr='Select a reason for this discount.';
  if(reasonErr)err=reasonErr;
  else if(!later&&total>0&&tend<=0)err='Enter the amount received, or go back and choose Pay Later.';
  const partial=!later&&tend>0&&tend<total-0.005;
  const over=!later&&c.method!=='Cash'&&tend>total+0.005;
  return {sub,disc,tax,del,total,tend,paid,change,err,reasonErr,partial,over,later,rate}}

  <div class="mf co-f"><div class="small t-bad grow" id="co-err">${esc(k.err)}</div><button type="button" class="btn pri" id="co-ok" data-act="coConfirm" ${k.err?'disabled':''}>${ic('check')} ${k.later?'Confirm order':'Confirm payment'}</button></div>`}

  if(k.later||k.tend<=0)return '';
  if(k.partial)return `<span class="t-warn">Partial payment. ${peso(r2(k.total-k.paid))} will stay unpaid on this order.</span>`;
  if(k.over)return `<span class="t-warn">Only ${peso(k.total)} will be recorded for non-cash accounts.</span>`;

const C39={'0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw','5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn','A':'wnnnnwnnw','B':'nnwnnwnnw','C':'wnwnnwnnn','D':'nnnnwwnnw','E':'wnnnwwnnn','F':'nnwnwwnnn','G':'nnnnnwwnw','H':'wnnnnwwnn','I':'nnwnnwwnn','J':'nnnnwwwnn','K':'wnnnnnnww','L':'nnwnnnnww','M':'wnwnnnnwn','N':'nnnnwnnww','O':'wnnnwnnwn','P':'nnwnwnnwn','Q':'nnnnnnwww','R':'wnnnnnwwn','S':'nnwnnnwwn','T':'nnnnwnwwn','U':'wwnnnnnnw','V':'nwwnnnnnw','W':'wwwnnnnnn','X':'nwnnwnnnw','Y':'wwnnwnnnn','Z':'nwwnwnnnn','-':'nwnnnnwnw','.':'wwnnnnwnn',' ':'nwwnnnwnn','*':'nwnnwnwnn'};

   if(window.claude&&window.claude.use){await rcptActs.rcptPdf(el);return} // print dialogs are blocked inside the sandboxed preview
   try{window.print()}catch(e){await rcptActs.rcptPdf(el)}}
};
/* ============ menus ============ */
const MENUS={
 cust:id=>`<button data-act="editCust" data-id="${id}">${ic('edit')} Edit Profile</button><button class="dng" data-act="delCust" data-id="${id}">${ic('trash')} Delete Customer</button>`,
 prd:id=>`<button data-act="editProd" data-id="${id}">${ic('edit')} Edit Product</button><button class="dng" data-act="delProd" data-id="${id}">${ic('trash')} Delete Product</button>`,
 svc:id=>`<button data-act="editSvc" data-id="${id}">${ic('edit')} Edit Service</button><button class="dng" data-act="delSvc" data-id="${id}">${ic('trash')} Delete Service</button>`,
 op:id=>{const o=op(id);return `<button data-act="editOp" data-id="${id}">${ic('edit')} Edit operator</button><button data-act="resetPass" data-id="${id}">${ic('lock')} Reset password</button><button data-act="toggleOp" data-id="${id}">${o.active?'Deactivate':'Activate'}</button><button class="dng" data-act="delOp" data-id="${id}">${ic('trash')} Delete</button>`}};
function closePop(){const p=$('.pop');if(p)p.remove()}
function openPop(btn){
  closePop();const type=btn.dataset.menu,id=btn.dataset.id;const r=btn.getBoundingClientRect();
  const d=document.createElement('div');d.className='pop';d.innerHTML=MENUS[type](id);document.body.appendChild(d);
  const w=d.offsetWidth,h=d.offsetHeight;let left=Math.min(Math.max(8,r.right-w),innerWidth-w-8),top=r.bottom+6;if(top+h>innerHeight-8)top=Math.max(8,r.top-h-6);
  d.style.left=left+'px';d.style.top=top+'px'}

/* ============ actions ============ */
const acts={
 ...rcptActs,...pettyActs,...xferActs,...bankActs,...cloudActs,...arcActs,
 ...rptActs,
 ...coActs,
 backup(){const t=new Date();saveFile("LaundryPOS-backup-"+dkey(t)+".json",JSON.stringify(S))},
 nav(el){ui.view=el.dataset.id;ui.navOpen=false;render();const c=$('#content');if(c)c.scrollTop=0},
 burger(){ui.navOpen=!ui.navOpen;$('#side').classList.toggle('open',ui.navOpen)},
 logout(){S.session=null;save();ui.loginErr='';render()},
 closeModal(){closeModal()},
 confirmYes(){const f=window.__cf;closeModal();if(f)f()},
 postab(el){ui.pos.tab=el.dataset.id;ui.pos.q='';render()},
 addCart(el){
  const kind=el.dataset.kind,id=el.dataset.id;const ex=ui.pos.cart.find(l=>l.kind===kind&&l.refId===id);
  if(ex){ex.qty=r2(ex.qty+1)}else{const s=kind==='service'?svc(id):prod(id);ui.pos.cart.push({kind,refId:id,qty:kind==='service'&&s.type==='Per Kg'?Math.max(1,s.baseKg):1})}
  $('#cart').innerHTML=V.pos.cart()},
 rmCart(el){ui.pos.cart.splice(+el.dataset.id,1);$('#cart').innerHTML=V.pos.cart()},
 qty(el){const l=ui.pos.cart[+el.dataset.id];const s=l.kind==='service'?svc(l.refId):null;const min=s&&s.type==='Per Kg'?s.baseKg:1;l.qty=Math.max(min,r2(l.qty+Number(el.dataset.d)));$('#cart').innerHTML=V.pos.cart()},
 clearCart(){ui.pos.cart=[];$('#cart').innerHTML=V.pos.cart()},
 paymode(el){ui.pos.pay=el.dataset.id;$('#cart').innerHTML=V.pos.cart()},
 checkout(){openCheckout()},
 per(el){const P=ui[el.dataset.scope].P;P.p=el.dataset.id;render()},
 ostat(el){ui.ord.status=el.dataset.id;render()},
 viewOrder(el){viewOrder(el.dataset.id)},
 collect(el){collectModal(el.dataset.id)},
 setStatus(el){const o=S.orders.find(x=>x.id===el.dataset.id);const s=el.dataset.s;
  if(s==='Cancelled'){confirmBox('Cancel this order?','The order stays in the list as cancelled and no longer counts toward sales or balances.','Cancel order',()=>{o.status='Cancelled';save();closeAll();render();toast('Order cancelled')});return}
  o.status=s;o.completedAt=s==='Completed'?new Date().toISOString():'';save();closeModal();render();viewOrder(o.id);toast('Marked '+s)},
 delOrder(el){const o=S.orders.find(x=>x.id===el.dataset.id);confirmBox('Delete order?','Delete <b>'+esc(o.no)+'</b> and its payments? Stock already used is not returned.','Delete',()=>{S.orders=S.orders.filter(x=>x.id!==o.id);save();render();toast('Order deleted')})},
 addProd(){prodForm()},editProd(el){closePop();prodForm(el.dataset.id)},
 delProd(el){closePop();const p=prod(el.dataset.id);const used=S.services.some(s=>(s.materials||[]).some(m=>m.pid===p.id));confirmBox('Delete product?','Delete <b>'+esc(p.name)+'</b>?'+(used?' It is used as a raw material by a service; that line will show as removed.':''),'Delete',()=>{S.products=S.products.filter(x=>x.id!==p.id);ui.pos.cart=ui.pos.cart.filter(l=>l.refId!==p.id);save();render();toast('Product deleted')})},
 addSvc(){svcForm()},editSvc(el){closePop();svcForm(el.dataset.id)},
 delSvc(el){closePop();const s=svc(el.dataset.id);confirmBox('Delete service?','Delete <b>'+esc(s.name)+'</b>? Existing orders keep their history.','Delete',()=>{S.services=S.services.filter(x=>x.id!==s.id);ui.pos.cart=ui.pos.cart.filter(l=>l.refId!==s.id);save();render();toast('Service deleted')})},
 addMat(el){const d=document.createElement('div');d.innerHTML=matRow(null);$('#matrows').appendChild(d.firstChild)},
 rmMat(el){el.closest('.row').remove()},
 addExpense(){expForm()},editExpense(el){expForm(el.dataset.id)},
 delExpense(el){const e=S.expenses.find(x=>x.id===el.dataset.id);if(pettyList().some(x=>x.expenseId===e.id&&x.tid)){toast('This petty cash payout is part of a cash transfer and cannot be deleted.',true);return}confirmBox('Delete expense?','Delete <b>'+esc(e.desc)+'</b> ('+peso(e.amount)+')?'+(e.source!=='Manual'?' The stock that was added stays on hand.':''),'Delete',()=>{S.expenses=S.expenses.filter(x=>x.id!==e.id);S.petty=pettyList().filter(x=>x.expenseId!==e.id);S.replenishments.forEach(r=>{if(r.expenseId===e.id)r.expenseId=''});save();render();toast('Expense deleted')})},
 addRepl(){replForm()},
 delRepl(el){const r=S.replenishments.find(x=>x.id===el.dataset.id);const p=prod(r.productId);confirmBox('Delete replenishment?','This removes the log, takes <b>'+r.qty+'</b> back off '+esc(p?p.name:'the product')+' and deletes its expense entry.','Delete',()=>{if(p)p.stock=Math.max(0,p.stock-r.qty);S.expenses=S.expenses.filter(e=>e.id!==r.expenseId);S.replenishments=S.replenishments.filter(x=>x.id!==r.id);save();render();toast('Replenishment deleted')})},
 addCust(){custForm()},editCust(el){closePop();custForm(el.dataset.id)},
 delCust(el){closePop();const c=cust(el.dataset.id);confirmBox('Delete customer?','Delete <b>'+esc(c.name)+'</b>? Their past orders will show as walk-in.','Delete',()=>{S.customers=S.customers.filter(x=>x.id!==c.id);S.orders.forEach(o=>{if(o.customerId===c.id)o.customerId='walkin'});if(ui.pos.cust===c.id)ui.pos.cust='walkin';save();render();toast('Customer deleted')})},
 addOp(){opForm()},editOp(el){closePop();opForm(el.dataset.id)},
 toggleOp(el){closePop();const o=op(el.dataset.id);if(o.id===me().id){toast('You cannot deactivate yourself.',true);return}if(o.active&&o.role==='Admin'&&S.operators.filter(x=>x.role==='Admin'&&x.active).length<2){toast('Keep at least one active admin.',true);return}o.active=!o.active;save();render()},
 delOp(el){closePop();const o=op(el.dataset.id);if(o.id===me().id){toast('You cannot delete yourself.',true);return}if(o.role==='Admin'&&S.operators.filter(x=>x.role==='Admin').length<2){toast('Keep at least one admin.',true);return}
  confirmBox('Delete operator?','Delete <b>'+esc(o.name)+'</b>? Their past sales stay in the records. Deactivate instead if you may need them again.','Delete',()=>{S.operators=S.operators.filter(x=>x.id!==o.id);save();render()})},
 resetPass(el){closePop();const o=op(el.dataset.id);formModal('Reset password for '+o.name,'resetpass',o.id,fld('New password','<input name="pw" type="password" minlength="6" required>'),'Set password')},
 resetOrders(){confirmBox('Reset all orders?','This deletes every order and payment. Products, services, customers, replenishments and expenses are kept.','Reset orders',()=>{S.orders=[];ui.pos.cart=[];save();render();toast('Orders cleared')})},
 resetAll(){if(cloud.cfg){toast('Erase all data is turned off while connected to the cloud. Disconnect this device first.',true);return}confirmBox('Erase all data?','Everything, including operators and your business details, is replaced with the sample data. You will be signed out.','Erase everything',async()=>{try{localStorage.removeItem(KEY)}catch(e){}await seed();ui.view='pos';render()})}
};

/* ============ forms ============ */
const forms={
 ...pettyForms,...xferForms,...bankForms,...cloudForms,
 async login(fd){const u=String(fd.get('u')).trim().toLowerCase(),h=await hash(String(fd.get('p')));
  const o=S.operators.find(x=>x.username.toLowerCase()===u);
  if(!o||o.pass!==h){ui.loginErr='Wrong username or password.';render();return false}
  if(!o.active){ui.loginErr='This operator is inactive. Ask an admin to reactivate the account.';render();return false}
  S.session={userId:o.id};ui.loginErr='';save();ui.view='pos';render();return false},
 business(fd){const b=S.business;b.name=fd.get('name').trim();b.tin=fd.get('tin').trim();b.address=fd.get('address').trim();b.phone=fd.get('phone').trim();b.email=fd.get('email').trim();b.openingCapital=r2(fd.get('openingCapital'));save();render();toast('Business details saved');return false},
 pricing(fd){const b=S.business;b.currency=fd.get('currency')||'PHP';const v=fd.get('taxType')==='vat';b.taxEnabled=v;if(v)b.taxRate=12;save();render();toast('Receipts & pricing saved');return false},
 async mypass(fd){const u=me();if(u.pass!==await hash(fd.get('cur'))){toast('Current password is wrong.',true);return false}
  if(fd.get('n1')!==fd.get('n2')){toast('New passwords do not match.',true);return false}u.pass=await hash(fd.get('n1'));save();render();toast('Password updated');return false},
 collect(fd,id){const o=S.orders.find(x=>x.id===id);const a=r2(fd.get('amount'));const bal=balanceOf(o);if(a<=0||a>bal+0.005){toast('Enter an amount up to '+peso(bal)+'.',true);return false}
  o.payments.push({id:uid('pay'),amount:a,method:fd.get('method'),date:new Date().toISOString(),operatorId:me().id});save();closeAll();render();toast('Collected '+peso(a)+' via '+fd.get('method'))},
 prod(fd,id){const d={name:fd.get('name').trim(),category:fd.get('category').trim(),unit:fd.get('unit').trim(),cost:r2(fd.get('cost')),price:r2(fd.get('price')),reorder:+fd.get('reorder')||0,stock:+fd.get('stock')||0,addon:fd.get('addon')==='on'};
  if(id){Object.assign(prod(id),d)}else{const p={id:uid('prd'),...d};S.products.push(p);
   if(p.stock>0)S.expenses.push({id:uid('exp'),date:dkey(new Date()),desc:'Opening inventory – '+p.name,ref:'',account:'Merchandise Inventory',source:'Opening Stock',amount:r2(p.cost*p.stock),by:me().id})}
  save();closeModal();render();toast('Product saved')},
 svc(fd,id){const mats=[];const ps=fd.getAll('mat_p'),qs=fd.getAll('mat_q');ps.forEach((p,i)=>{if(p)mats.push({pid:p,qty:Math.max(1,+qs[i]||1)})});
  const d={name:fd.get('name').trim(),type:fd.get('type'),price:r2(fd.get('price')),baseKg:+fd.get('baseKg')||1,color:fd.get('color')||COLORS[1],materials:mats};
  if(id)Object.assign(svc(id),d);else S.services.push({id:uid('svc'),...d});save();closeModal();render();toast('Service saved')},
 exp(fd,id){const d={desc:fd.get('desc').trim(),date:fd.get('date'),amount:r2(fd.get('amount')),account:fd.get('account'),ref:fd.get('ref').trim()};
  if(id)Object.assign(S.expenses.find(x=>x.id===id),d);else S.expenses.push({id:uid('exp'),...d,source:'Manual',by:me().id});save();closeModal();render();toast('Expense saved')},
 repl(fd){const p=prod(fd.get('productId'));const qty=Math.max(1,Math.floor(+fd.get('qty')||0)),unit=r2(fd.get('unit'));const eid=uid('exp');
  p.stock=r2(p.stock+qty);p.cost=unit;
  S.expenses.push({id:eid,date:fd.get('date'),desc:'Inventory replenishment – '+p.name,ref:'',account:'Merchandise Inventory',source:'Replenishment',amount:r2(qty*unit),by:me().id});
  S.replenishments.push({id:uid('rep'),productId:p.id,name:p.name,supplier:fd.get('supplier').trim(),qty,unit,date:fd.get('date'),expenseId:eid});save();closeModal();render();toast('Stock added: '+qty+' × '+p.name)},
 cust(fd,id){const d={name:fd.get('name').trim(),email:fd.get('email').trim(),phone:fd.get('phone').trim(),tin:fd.get('tin').trim(),address:fd.get('address').trim()};
  if(id)Object.assign(cust(id),d);else{const c={id:nextCustId(),...d};S.customers.push(c);if(ui.view==='pos')ui.pos.cust=c.id}save();closeModal();render();toast('Customer saved')},
 async op(fd,id){const un=fd.get('username').trim().toLowerCase();if(S.operators.some(o=>o.username.toLowerCase()===un&&o.id!==id)){toast('That username is taken.',true);return false}
  if(id){const o=op(id);const wasAdmin=o.role==='Admin';if(wasAdmin&&fd.get('role')!=='Admin'&&S.operators.filter(x=>x.role==='Admin').length<2){toast('Keep at least one admin.',true);return false}o.name=fd.get('name').trim();o.username=un;o.role=fd.get('role')}
  else S.operators.push({id:uid('op'),code:nextOpId(),name:fd.get('name').trim(),username:un,pass:await hash(fd.get('password')),role:fd.get('role'),active:true});
  save();closeModal();render();toast('Operator saved')},
 async resetpass(fd,id){op(id).pass=await hash(fd.get('pw'));save();closeModal();toast('Password reset')}
};

/* ============ events ============ */
document.addEventListener('click',e=>{
  const m=e.target.closest('[data-menu]');
  if(m){e.stopPropagation();const open=$('.pop');const same=open&&open.dataset.for===m.dataset.menu+m.dataset.id;closePop();if(!same){openPop(m);$('.pop').dataset.for=m.dataset.menu+m.dataset.id}return}
  const a=e.target.closest('[data-act]');
  if(a&&acts[a.dataset.act]){if(!a.closest('.pop'))closePop();else setTimeout(closePop,0);acts[a.dataset.act](a);return}
  if(!e.target.closest('.pop'))closePop();
  if(ui.navOpen&&!e.target.closest('.side')&&!e.target.closest('.burger')){ui.navOpen=false;const s=$('#side');if(s)s.classList.remove('open')}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.co){ui.co[t.dataset.co]=t.value;coUpdate();return}
  if(t.dataset&&t.dataset.bind&&t.dataset.live){setPath(t.dataset.bind,t.value);refreshList()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.co){ui.co[t.dataset.co]=t.value;coUpdate();return}
  if(t.dataset.bind&&!t.dataset.live){let v=t.value;if(t.dataset.num)v=Math.max(0,Number(v)||0);setPath(t.dataset.bind,v);
    if(t.dataset.bind.startsWith('pos.')){$('#cart').innerHTML=V.pos.cart()}else render();return}
  if(t.dataset.cartqty!=null){const l=ui.pos.cart[+t.dataset.cartqty];const s=l.kind==='service'?svc(l.refId):null;const min=s&&s.type==='Per Kg'?s.baseKg:1;l.qty=Math.max(min,r2(t.value)||min);$('#cart').innerHTML=V.pos.cart();return}
  if(t.dataset.actChange==='setExpected'){const o=S.orders.find(x=>x.id===t.dataset.id);o.expected=t.value?new Date(t.value).toISOString():'';save();render();toast('Expected time updated')}
  if(t.name==='color'){const f=t.closest('form');f.querySelectorAll('[data-colorpick]').forEach(s=>{s.style.boxShadow='0 0 0 2px var(--surface),0 0 0 3.5px transparent'});t.nextElementSibling.style.boxShadow='0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)'}
  if(t.id==='rp'){const p=prod(t.value);const f=t.closest('form');if(p)f.elements.unit.value=p.cost}
});
document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const fn=forms[f.dataset.form];if(!fn)return;
  const r=await fn(new FormData(f),f.dataset.id||'');
  if(r===false&&['login','business','mypass'].includes(f.dataset.form)&&f.dataset.form!=='login')return;
});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='bkfile')restoreFile(e.target)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePop();if(modalStack.length)closeModal()}});
addEventListener('scroll',closePop,true);

/* ============ boot ============ */
async function boot(){
  S=loadState();
  if(!S)await seed();
  S.sample=S.sample||false;fixBooks();
  render();cloudInit();
}
boot();
